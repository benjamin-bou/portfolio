# Déploiement du portfolio derrière Traefik sur bboutrois.fr.
# Se branche sur le réseau externe "web" (partagé avec Traefik).

services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`bboutrois.fr`) || Host(`www.bboutrois.fr`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=le"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  web:
    external: true
