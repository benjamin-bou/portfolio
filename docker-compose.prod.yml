# Compose de PRODUCTION : tire l'image déjà construite depuis GHCR (aucun build ici).
# Déployé par la CI sur le VPS (user deploy) sous ~/apps/portfolio/docker-compose.yml.

services:
  portfolio:
    image: ghcr.io/benjamin-bou/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`bboutrois.fr`) || Host(`www.bboutrois.fr`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=le"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  web:
    external: true
